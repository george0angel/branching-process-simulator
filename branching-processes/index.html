<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Branching processes simulator</title>
    <link rel="stylesheet" href="../assets/css/main.css" />
  </head>
  <body>
    <header>
      <h1>Branching processes</h1>
      <nav>
        <a href="../">Home</a>
      </nav>
    </header>

    <main>
      <h2>Branching processes simulator</h2>
      <p>
        Particles move randomly and split into new branches at random time
        intervals.
      </p>

      <div class="simulation-layout">
        <form id="controls">
          <h3>Parameters</h3>

          <div style="display: block">
            <label>
              Process type
              <select id="process-type">
                <option value="bm">Brownian motion</option>
                <option value="rw">Random walk</option>
              </select>
            </label>
          </div>

          <div data-process="bm rw" style="display: none">
            <label>
              Graph mode
              <select id="graph-mode">
                <option value="xt">X (with time axis)</option>
                <option value="xy">X, Y (without time axis)</option>
                <option value="xyt">X, Y (with time axis)</option>
                <option value="xyz">X, Y, Z</option>
              </select>
            </label>
          </div>

          <div data-process="bm rw" style="display: none">
            <label>
              Duration
              <input
                id="duration"
                type="number"
                min="1"
                max="10000"
                step="1"
                value="10"
              />
            </label>
          </div>

          <div data-process="bm" style="display: none">
            <label>
              Time step
              <input
                id="dt"
                type="number"
                min="0.0001"
                max="1"
                step="0.00000001"
                data-jump="0.01"
                value="0.05"
              />
            </label>
          </div>

          <div data-process="bm" style="display: none">
            <label>
              Diffusion
              <input
                id="diffusion"
                type="number"
                min="0"
                max="1000000000000"
                step="0.00000001"
                data-jump="0.1"
                value="1"
              />
            </label>
          </div>

          <div data-process="bm" style="display: none">
            <label>
              Drift
              <input
                id="drift"
                type="number"
                min="-1000000000000"
                max="1000000000000"
                step="0.00000001"
                data-jump="0.1"
                value="0"
              />
            </label>
          </div>

          <div data-process="bm rw" style="display: none">
            <label>
              Branching rate
              <input
                id="branching-rate"
                type="number"
                min="0"
                max="10"
                step="0.00000001"
                data-jump="0.05"
                value="0.3"
              />
              <label
                ><span style="font-size: small">Enabled?</span
                ><input id="branching-on" type="checkbox" checked
              /></label>
            </label>
          </div>

          <div data-process="bm rw" style="display: none">
            <label>
              Initial particles
              <input
                id="initial-particles"
                type="number"
                min="1"
                max="100"
                step="1"
                value="1"
              />
            </label>
          </div>

          <div
            id="max-particles-input"
            data-process="bm rw"
            style="display: none"
          >
            <label>
              Population cap
              <input
                id="max-particles"
                type="number"
                min="1"
                max="10000"
                step="1"
                value="300"
              />
              <label
                ><span style="font-size: small">Enabled?</span
                ><input id="max-particles-on" type="checkbox" checked
              /></label>
            </label>
          </div>

          <div data-process="bm rw" style="display: none">
            <label>
              Seed
              <input
                id="seed"
                type="number"
                value="0"
                min="0"
                max="4294967295"
              />
              <label
                ><span style="font-size: small">Enabled?</span
                ><input id="seed-on" type="checkbox" checked
              /></label>
            </label>
          </div>

          <button id="simulate-button" type="submit">Run simulation</button>
          <p id="status">Ready</p>
        </form>

        <section>
          <h3>Result</h3>
          <div id="trajectory-plot"></div>

          <h3>Summary</h3>
          <dl>
            <dt>Final population</dt>
            <dd id="final-population">—</dd>

            <dt>Particles created</dt>
            <dd id="particles-created">—</dd>

            <dt>Maximum generation</dt>
            <dd id="maximum-generation">—</dd>

            <dt>Mean final position</dt>
            <dd id="mean-final-position">—</dd>
          </dl>

          <p id="note"></p>
        </section>
      </div>
    </main>

    <footer>
      <p><a href="../">Return home</a></p>
    </footer>

    <script
      src="https://cdn.plot.ly/plotly-3.7.0.min.js"
      charset="utf-8"
    ></script>

    <script type="module" src="./app.js"></script>
  </body>
</html>
